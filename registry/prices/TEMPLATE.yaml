# Tamias dated price sheet -- spec section 9.1
#
# Copy this file to `registry/prices/<provider>-<model>-<accessed>.yaml` and
# fill every price from the provider's official pricing page.
#
# TODO(owner): all five per-million prices below are null. Tamias never invents
# a price: while a price that a request needs is null, that request's
# C_realized_request is the string UNKNOWN, not 0.00.
#
# `accessed` is the date the pricing page was read. `source_url` is that page.
# Both are required before Tamias will report any dollar amount, because a
# price without its source and access date is not traceable (AGENTS rule 5).

provider: null  # TODO(owner): e.g. the provider as the ledger records it
model: null  # TODO(owner): the exact model id the ledger records
accessed: null  # TODO(owner): YYYY-MM-DD the pricing page was read
source_url: null  # TODO(owner): official pricing page for this model

input_per_million: null  # TODO(owner): USD per 1e6 input tokens
output_per_million: null  # TODO(owner): USD per 1e6 output tokens
cache_read_per_million: null  # TODO(owner): USD per 1e6 cache-read tokens
cache_write_5m_per_million: null  # TODO(owner): USD per 1e6 5-minute cache-write tokens
cache_write_1h_per_million: null  # TODO(owner): USD per 1e6 1-hour cache-write tokens

# Context-length tiers. Optional. A tier is applied only when the caller can
# state the request's context length; Tamias never infers it from token sums.
# Entries are merged over the base prices above, one key per price field:
#
# long_context_tiers:
#   - name: long_context_128k
#     min_context_tokens: 128000
#     input_per_million: 6.00
long_context_tiers: []

# Service/speed tiers. Optional. A tier is selected from the request's
# recorded `speed_or_service_tier`. A request whose tier is not listed here is
# UNKNOWN, not defaulted to the base price.
#
# speed_or_service_tiers:
#   priority:
#     input_per_million: 6.00
speed_or_service_tiers: {}

# Credits and refunds. Optional. Tamias surfaces these next to the cost and
# never applies them to C_realized_request automatically, because a credit is
# not a token price and applying it would change a dollar figure silently.
credits_or_refunds: {}